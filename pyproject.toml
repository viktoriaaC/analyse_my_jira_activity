[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-activity"
version = "0.1.0"
description = "CLI that shows which statuses your Jira tickets have been in during a date range"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "keyring>=24",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jira-activity = "jira_activity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
